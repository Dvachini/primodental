name: Build & Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 📁 Inject client .env
        run: echo "${{ secrets.CLIENT_ENV }}" > ./client/.env

      - name: 🔑 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :production is what the host runs; the sha tag keeps every release for rollback
          tags: |
            dvachini/primodental:production
            dvachini/primodental:${{ github.sha }}
          cache-from: type=registry,ref=dvachini/primodental:production
          cache-to: type=inline
          build-args: |
            NODE_ENV=production

      # Written after the image build so the server secrets never enter the build context
      - name: 📁 Inject .env file
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: printf '%s\n' "$PRODUCTION_ENV" > .env

      - name: 📤 Upload .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: '.env'
          target: '~/primodental/'
          overwrite: true

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/primodental
            docker compose pull primodental || docker pull dvachini/primodental:production
            docker compose up -d primodental
            docker image prune -f
